# Basic GPIO matrix configuration
CONFIG_GPIO=y
# Assert the TrackPoint's active-low power enable during GPIO initialization.
CONFIG_GPIO_HOGS=y

# Runtime keymap editing over USB serial / BLE. Requires the physical layout in
# dabao-layouts.dtsi (a chosen matrix-transform is not enough), and the
# studio-rpc-usb-uart snippet for the USB CDC-ACM endpoint (see build.yaml and
# bin/build.sh). Defaults for locking on disconnect/idle are left as-is.
CONFIG_ZMK_STUDIO=y

# Enable matrix polling for reliability
CONFIG_ZMK_KSCAN_MATRIX_POLLING=y

# Send modifier releases in a separate HID report from the key release.
# ZMK sends implicit modifiers (&kp LC(x) / &kp LS(x)) in the same report as
# the key, which GNOME/Wayland and Windows RDP can mishandle (zmk#759).
# This changes the HID report descriptor, so it needs a pristine rebuild.
CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=y

# Fix picolibc symbol conflicts - use newlib instead
CONFIG_PICOLIBC=n
CONFIG_NEWLIB_LIBC=y

# Enable I2C support for MCP23017 expander
CONFIG_PINCTRL=y
CONFIG_I2C=y

CONFIG_INPUT=y

CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# UART-based PS/2 driver config
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PS2=y
CONFIG_PS2_UART=y

# The trackpoint tuning keys on the mouse layer (&mms ...) save their value with
# settings_save_one(), which the driver schedules CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE
# after the last change. The ZMK default is 60000ms, so an adjustment is lost if
# the keyboard is powered off within a minute of making it. This also shortens
# the debounce for BLE profile, endpoint, ext-power and underglow saves, which
# just means those reach flash a little sooner. Lower it further if 5s still
# feels long; the writes are 4 bytes each, so flash wear is not a concern.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=5000

# Pace trackpoint reports so they fit the BLE connection interval instead of
# overflowing the HID-over-GATT send queue. The driver accumulates movement and
# sends the total at most once per interval, so no motion is lost, it is just
# coalesced. Not transport-aware: this also caps USB to ~125 reports/s.
CONFIG_ZMK_INPUT_MOUSE_PS2_REPORT_INTERVAL_MIN=8

